# fly.toml app configuration file generated for tanks-adamschaal on 2026-07-27T23:27:21-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tanks-adamschaal'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 50
    soft_limit = 40

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
